<!--
═══════════════════════════════════════════════════════════════════
  Rimail — تعليمات النشر (مجاني بالكامل على خطة Spark)
═══════════════════════════════════════════════════════════════════
1) أنشئ مشروعًا في Firebase Console (خطة Spark المجانية).
2) Authentication ← Sign-in method ← فعّل "Email/Password".
3) Firestore Database ← أنشئ قاعدة بيانات (Production mode).
4) Project settings ← انسخ إعدادات تطبيق الويب والصقها في FIREBASE_CONFIG أدناه.
5) الصق القواعد التالية في Firestore ← Rules ثم Publish:

rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {

    function signedIn() { return request.auth != null; }

    function validMail(d) {
      return d.keys().hasOnly(['id','from','fromName','to','cc','bcc','subject','body','ts',
                               'folder','read','starred','important','labels','archived',
                               'snoozeUntil','category','prevFolder','trashedAt'])
        && d.subject is string && d.subject.size() <= 300
        && d.body is string && d.body.size() <= 20000
        && d.from is string && d.from.size() <= 80
        && d.fromName is string && d.fromName.size() <= 60
        && d.to is list && d.to.size() <= 50
        && d.cc is list && d.cc.size() <= 50
        && d.bcc is list && d.bcc.size() <= 50
        && d.labels is list && d.labels.size() <= 30
        && d.ts is number
        && d.folder in ['inbox','sent','draft','trash','spam'];
    }

    match /usernames/{u} {
      allow read: if signedIn();
      allow create: if signedIn()
        && u.matches('^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]$')
        && request.resource.data.keys().hasOnly(['uid','name'])
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.name is string
        && request.resource.data.name.size() <= 60
        && request.auth.token.email == u + '@rimail.app';
      allow update, delete: if false;
    }

    match /users/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow create: if signedIn() && request.auth.uid == uid
        && request.resource.data.get('plan', 'free') == 'free';
      // العميل لا يستطيع تغيير الخطة أو اسم المستخدم (الترقية المدفوعة تتم من جهة الإدارة فقط)
      allow update: if signedIn() && request.auth.uid == uid
        && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['plan','planUntil','username']);
      allow delete: if false;
    }

    match /mailboxes/{uid}/mails/{id} {
      allow read, delete: if signedIn() && request.auth.uid == uid;
      allow update: if signedIn() && request.auth.uid == uid && validMail(request.resource.data);
      allow create: if signedIn() && validMail(request.resource.data)
        && request.resource.data.id == id
        && (
          request.auth.uid == uid
          || (
            request.resource.data.folder == 'inbox'
            && request.resource.data.from == request.auth.token.email
            && request.resource.data.fromName ==
               get(/databases/$(db)/documents/usernames/$(request.auth.token.email.split('@')[0])).data.name
            && request.resource.data.read == false
            && request.resource.data.starred == false
            && request.resource.data.important == false
            && request.resource.data.labels.size() == 0
            && request.resource.data.bcc.size() == 0
            && id.matches('^[a-z0-9]{6,40}-r$')
          )
        );
    }
  }
}

6) Authentication ← Settings ← Authorized domains: أضف نطاقك.
7) النشر: firebase init hosting ثم firebase deploy (Hosting مجاني).
   أضف في firebase.json ترويسات الحماية:
   "headers":[{"source":"**","headers":[
     {"key":"X-Frame-Options","value":"DENY"},
     {"key":"X-Content-Type-Options","value":"nosniff"},
     {"key":"Referrer-Policy","value":"no-referrer"},
     {"key":"Strict-Transport-Security","value":"max-age=31536000; includeSubDomains"}]}]
8) (اختياري) قيّد مفتاح API من Google Cloud Console ← Credentials على نطاقك فقط.

للترقية المدفوعة لاحقًا: اضبط الحقل plan = "pro" في مستند users/{uid} من الإدارة
(أو من Cloud Function مستقبلًا)، وعدّل الحدود في PLANS أدناه.

<style>
:root{
  --bg:#f6f8fc;--surface:#fff;--read:#eef2f9;--text:#1f1f1f;--sub:#444746;--accent:#d3e3fd;--accent-text:#041e49;
  --border:#e0e2e0;--search:#eaf1fb;--fab:#c2e7ff;--fab-text:#001d35;--brand:#d93025;--star:#f4b400;
  --hover:rgba(31,31,31,.08);--danger:#b3261e;--overlay:rgba(0,0,0,.4);--snack:#303030;--snack-text:#f2f2f2;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#131314;--surface:#1e1f20;--read:#191a1b;--text:#e3e3e3;--sub:#c4c7c5;--accent:#004a77;--accent-text:#c2e7ff;
  --border:#444746;--search:#2d2f31;--fab:#004a77;--fab-text:#c2e7ff;--brand:#f28b82;--hover:rgba(255,255,255,.1);
  --danger:#f2b8b5;--overlay:rgba(0,0,0,.6);--snack:#e3e3e3;--snack-text:#1f1f1f;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.material-symbols-outlined.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.btn{padding:9px 22px;border-radius:20px;font-weight:600;color:#0b57d0}
.btn:hover{background:var(--hover)}
.btn.primary{background:#0b57d0;color:#fff}
.btn.primary:hover{background:#0a4cb8}
[data-theme=dark] .btn{color:#a8c7fa}[data-theme=dark] .btn.primary{background:#a8c7fa;color:#062e6f}
.grow{flex:1}

/* ===== شاشة الدخول ===== */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow:auto;z-index:500}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:36px 28px;width:100%;max-width:420px}
.auth-card .logo{width:52px;height:52px;margin:0 auto 8px;display:block}
.auth-card h1{text-align:center;font-size:1.5rem;font-weight:600}
.auth-card p.sub{text-align:center;color:var(--sub);margin:6px 0 22px}
.field{margin-bottom:14px}
.field input{width:100%;padding:14px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;outline:none}
.field input:focus,.addr:focus-within{border-color:#0b57d0;box-shadow:0 0 0 1px #0b57d0}
.addr{display:flex;direction:ltr;align-items:center;border:1px solid var(--border);border-radius:8px;padding-inline-end:12px}
.addr input{border:none!important;box-shadow:none!important;flex:1;min-width:0;direction:ltr;text-align:left}
.addr span{color:var(--sub);white-space:nowrap}
.err{color:var(--danger);font-size:.85rem;min-height:1.3em;margin-bottom:8px}
.auth-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.demo-note{margin-top:20px;font-size:.78rem;color:var(--sub);background:var(--read);padding:10px 12px;border-radius:12px;line-height:1.7}

/* ===== الهيكل ===== */
#app{display:flex;height:100vh;height:100dvh}
.drawer{position:fixed;top:0;bottom:0;right:0;width:288px;max-width:86vw;background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:8px 0 24px;visibility:hidden}
.drawer.open{transform:none;visibility:visible;box-shadow:0 0 24px rgba(0,0,0,.3)}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:90;display:none}
.overlay.on{display:block}
.brand{display:flex;align-items:center;gap:10px;padding:12px 24px;font-size:1.35rem;font-weight:700;color:var(--brand)}
.brand svg{width:34px;height:34px}
.fab-spacer{display:none}
.nav-item{display:flex;align-items:center;gap:18px;height:40px;padding:0 24px;margin-inline-end:12px;border-radius:0 20px 20px 0;color:var(--text);cursor:pointer;font-size:.92rem;width:calc(100% - 12px);text-align:start}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent);color:var(--accent-text);font-weight:700}
.nav-item .cnt{margin-inline-start:auto;font-size:.8rem;font-weight:600}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sep{height:1px;background:var(--border);margin:8px 16px}
.nav-head{display:flex;align-items:center;padding:6px 24px;color:var(--sub);font-size:.85rem;font-weight:600}
.lm{opacity:.0;width:32px;height:32px}
.nav-item:hover .lm,.nav-item.active .lm{opacity:1}
@media(hover:none){.lm{opacity:1}}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{padding:8px 12px calc(4px) 12px;display:flex;align-items:center;min-height:64px}
#searchbar,#selbar{width:100%;max-width:760px;height:48px;border-radius:24px;display:flex;align-items:center;gap:4px;padding:0 6px}
#searchbar{background:var(--search)}
#searchbar:focus-within{background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.3)}
#q{border:none;background:transparent;flex:1;min-width:0;outline:none;font-size:1rem;height:100%}
#q::placeholder{color:var(--sub)}
#selbar{background:var(--accent);color:var(--accent-text);max-width:none}
#selbar .icon-btn{color:var(--accent-text)}
.sel-count{font-weight:700;font-size:1.1rem;margin-inline-start:6px}
.avatar{width:34px;height:34px;border-radius:50%;background:#8d6e63;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;cursor:pointer;flex-shrink:0;margin-inline-start:2px}
.desk-only{display:none}

.panel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:18px;color:var(--sub);font-weight:600;font-size:.88rem;white-space:nowrap;border:1px solid transparent}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--accent);color:var(--accent-text)}
.tab .b{background:var(--brand);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px}
.list{flex:1;overflow-y:auto;padding:0 12px calc(96px + var(--safe-b))}
.section-title{font-size:.85rem;color:var(--sub);margin:10px 4px 8px;font-weight:600}
.banner{background:var(--surface);border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-size:.85rem;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner button{color:#0b57d0;font-weight:600}
[data-theme=dark] .banner button{color:#a8c7fa}
.empty{text-align:center;color:var(--sub);padding:70px 20px}
.empty .material-symbols-outlined{font-size:72px;opacity:.5;display:block;margin:0 auto 10px}

.swipe{position:relative;border-radius:16px;overflow:hidden;margin-bottom:8px;background:#188038}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}
.email-item{position:relative;background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;touch-action:pan-y}
.email-item:not(.unread){background:var(--read)}
.email-item.sel{background:var(--accent)!important}
.sender-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.05rem;flex-shrink:0}
.email-item.sel .sender-avatar{background:#0b57d0!important}
.email-content{flex:1;min-width:0}
.email-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sender-name{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-date{font-size:.74rem;color:var(--sub);white-space:nowrap}
.email-subject{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.email-snippet{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .sender-name,.unread .email-subject{font-weight:700}
.unread .email-date{color:var(--text);font-weight:700}
.draft-tag{color:var(--danger);font-weight:600}
.chip-l,.chip-s{display:inline-flex;align-items:center;gap:3px;background:var(--search);color:var(--sub);border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:600;margin-inline-end:4px;vertical-align:middle}
.chip-s .material-symbols-outlined{font-size:12px}
.star-btn{color:var(--sub);margin-top:2px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.star-btn:hover{background:var(--hover)}
.star-btn.on{color:var(--star)}

.fab{position:fixed;bottom:calc(20px + var(--safe-b));left:16px;background:var(--fab);color:var(--fab-text);padding:16px 20px;border-radius:16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:.95rem;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:10;transition:padding .2s}
.fab.mini{padding:16px}
.fab.mini .fab-text{display:none}
body.reading .fab{display:none}

/* ===== القارئ ===== */
.reader{position:fixed;inset:0;background:var(--surface);z-index:60;display:flex;flex-direction:column}
.r-bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.r-scroll{flex:1;overflow-y:auto;padding:16px 18px 40px}
.r-subject{display:flex;align-items:flex-start;gap:8px}
.r-subject h1{font-size:1.35rem;font-weight:600;line-height:1.5;flex:1;word-break:break-word}
.r-labels{margin:6px 0 4px}
.r-sender{display:flex;gap:12px;align-items:flex-start;margin:16px 0 8px}
.r-meta{flex:1;min-width:0}
.r-meta b{font-size:.95rem}
.r-meta small{color:var(--sub);margin-inline-start:6px}
.r-to{color:var(--sub);font-size:.82rem;display:flex;align-items:center;gap:2px;cursor:pointer;width:fit-content}
.r-to .material-symbols-outlined{font-size:18px}
.r-details{background:var(--read);border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-size:.82rem;line-height:1.9;color:var(--sub);word-break:break-all}
.r-details b{color:var(--text);margin-inline-end:6px}
.r-body{white-space:pre-wrap;word-break:break-word;line-height:1.8;margin:14px 0 24px;font-size:.95rem}
.r-body a{color:#0b57d0}[data-theme=dark] .r-body a{color:#a8c7fa}
.r-actions{display:flex;gap:10px;flex-wrap:wrap}
.r-actions button{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-weight:600;color:var(--sub)}
.r-actions button:hover{background:var(--hover)}
.r-trash-note{background:var(--read);padding:8px 16px;font-size:.82rem;color:var(--sub)}

/* ===== النوافذ المنبثقة ===== */
.compose{position:fixed;inset:0;background:var(--surface);z-index:120;display:flex;flex-direction:column}
.c-head{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;background:var(--read);border-bottom:1px solid var(--border);font-weight:600}
.c-head .c-title{flex:1}
.c-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:0 14px}
.c-row{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--border);padding:6px 0;min-height:44px}
.c-row>label{color:var(--sub);font-size:.85rem;width:44px;flex-shrink:0;padding-top:7px}
.c-from{padding-top:7px;color:var(--sub);font-size:.88rem;direction:ltr;unicode-bidi:plaintext}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.chips input{flex:1;min-width:110px;border:none;background:transparent;outline:none;padding:6px 0;direction:ltr;text-align:left}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--search);border-radius:14px;padding:2px 4px 2px 10px;font-size:.82rem;direction:ltr}
.chip.bad{background:#f9dedc;color:#8c1d18}
.chip button{width:20px;height:20px;border-radius:50%;line-height:1;font-size:1rem;color:inherit}
.chip button:hover{background:var(--hover)}
#c-subj{flex:1;border:none;background:transparent;outline:none;padding:7px 0;min-width:0}
#c-text{flex:1;min-height:200px;border:none;background:transparent;outline:none;resize:none;padding:12px 0;line-height:1.8}
.c-foot{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + var(--safe-b));border-top:1px solid var(--border)}
.c-foot .send{background:#0b57d0;color:#fff;border-radius:20px;padding:9px 26px;font-weight:700;display:flex;align-items:center;gap:6px}
[data-theme=dark] .c-foot .send{background:#a8c7fa;color:#062e6f}
#c-status{font-size:.78rem;color:var(--sub)}
.compose.min .c-body,.compose.min .c-foot{display:none}

.dlg-back{position:fixed;inset:0;background:var(--overlay);z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.dlg h3{font-weight:600;margin-bottom:14px;font-size:1.15rem}
.dlg-body{color:var(--sub);line-height:1.8}

.dlg-body textarea{min-height:90px;resize:vertical;line-height:1.7}
.dlg-body label.opt{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text);cursor:pointer}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.menu{position:fixed;z-index:200;background:var(--surface);border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.3);min-width:220px;max-width:calc(100vw - 16px);max-height:70vh;overflow-y:auto;padding:6px 0}

.menu-head{padding:14px 18px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu-head b{display:block}.menu-head span{color:var(--sub);font-size:.82rem;direction:ltr;display:block;text-align:right;unicode-bidi:plaintext}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:10px 18px;text-align:start;font-size:.9rem}
.menu-item:hover{background:var(--hover)}
.menu-item .material-symbols-outlined{font-size:20px;color:var(--sub)}
.mchk{width:20px;display:inline-flex}

<script type="module">
'use strict';
/* ═══════════════════════════ الإعدادات ═══════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const USE_FIREBASE = !/^YOUR_/.test(FIREBASE_CONFIG.apiKey);
const DOMAIN = 'rimail.app';
/* خطط الاستخدام: المجانية الآن، وجاهزة للخطة المدفوعة مستقبلًا (plan = "pro" في مستند المستخدم) */
const PLANS = {
  free: { name: 'مجانية', maxRecipients: 20, sendsPerHour: 60,  maxLabels: 30 },
  pro:  { name: 'Pro',    maxRecipients: 50, sendsPerHour: 500, maxLabels: 30 }
};
const MAX_BODY = 20000, MAX_SUBJECT = 300, LOCALE = 'ar-u-nu-latn';
const FOLDERS = ['inbox','sent','draft','trash','spam'];
const CAT_KEYS = ['primary','promo','social','updates'];
const CATS = [
  { k:'primary', t:'أساسي',   i:'inbox' },
  { k:'promo',   t:'ترويجات', i:'sell' },
  { k:'social',  t:'اجتماعي', i:'group' },
  { k:'updates', t:'تحديثات', i:'info' }
];
const NAV = [
  ['inbox','inbox','صندوق الوارد'], ['starred','star','مميّزة بنجمة'], ['snoozed','schedule','مؤجلة'],
  ['important','label_important','المهمة'], ['sent','send','المرسلة'], ['draft','draft','المسودات'],
  ['all','all_inbox','كل الرسائل'], ['spam','report','غير مرغوب فيها'], ['trash','delete','سلة المحذوفات']
];
const EMPTY = {
  inbox:['inbox','لا توجد رسائل هنا'], starred:['star','لا توجد رسائل مميّزة بنجمة'], snoozed:['schedule','لا توجد رسائل مؤجلة'],
  important:['label_important','لا توجد رسائل مهمة'], sent:['send','لا توجد رسائل مرسلة'], draft:['draft','لا توجد مسودات'],
  all:['all_inbox','لا توجد رسائل'], spam:['report','لا توجد رسائل غير مرغوب فيها'], trash:['delete','السلة فارغة'], q:['search','لا توجد نتائج مطابقة']
};

/* ═══════════════════════════ أدوات عامة ═══════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const uid = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36); };
const now = () => Date.now();
const I = (n, c = '') => `<span class="material-symbols-outlined ${c}" aria-hidden="true">${n}</span>`;
const COLORS = ['#8d6e63','#1a73e8','#188038','#b45309','#8e24aa','#d93025','#007b83','#c2185b','#5f6368'];
const colorOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const initial = s => ([...String(s || '').trim()][0] || '?').toUpperCase();
const local = a => String(a).split('@')[0];
const validAddr = a => new RegExp('^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]@' + DOMAIN.replace('.', '\\.') + '$').test(a);
const validUser = u => /^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]$/.test(u);
function fmtDate(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString(LOCALE, { hour: 'numeric', minute: '2-digit' });
  if (d.getFullYear() === n.getFullYear()) return d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' });
  return d.toLocaleDateString(LOCALE, { year: '2-digit', month: 'numeric', day: 'numeric' });
}
const fmtFull = ts => new Date(ts).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' });
const linkify = t => esc(t).replace(/https?:\/\/[^\s<>&]+(?:&amp;[^\s<>&]+)*/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

/* ═══════════════════════════ نموذج الرسالة ═══════════════════════════ */
const blank = () => ({ id:'', from:'', fromName:'', to:[], cc:[], bcc:[], subject:'', body:'', ts:0, folder:'inbox', read:false,
  starred:false, important:false, labels:[], archived:false, snoozeUntil:0, category:'primary', prevFolder:'', trashedAt:0 });
const KEYS = Object.keys(blank());
const clean = m => { const b = blank(), o = {}; for (const k of KEYS) o[k] = m[k] === undefined ? b[k] : m[k]; return JSON.parse(JSON.stringify(o)); };
function norm(raw) {
  const b = blank(), m = {};
  for (const k of KEYS) m[k] = raw[k] === undefined ? b[k] : raw[k];
  for (const k of ['to','cc','bcc','labels']) m[k] = Array.isArray(m[k]) ? m[k].filter(x => typeof x === 'string') : [];
  for (const k of ['id','from','fromName','subject','body','prevFolder']) m[k] = typeof m[k] === 'string' ? m[k] : '';
  for (const k of ['ts','snoozeUntil','trashedAt']) m[k] = Number(m[k]) || 0;
  for (const k of ['read','starred','important','archived']) m[k] = !!m[k];
  if (!FOLDERS.includes(m.folder)) m.folder = 'inbox';
  if (!CAT_KEYS.includes(m.category)) m.category = 'primary';
  return m;
}
const inboxCopy = m => ({ ...clean(m), id: m.id + '-r', folder:'inbox', read:false, starred:false, important:false,
  labels:[], archived:false, snoozeUntil:0, category:'primary', bcc:[], prevFolder:'', trashedAt:0 });

/* ═══════════════════════════ الواجهة الخلفية: محلية (تجريبية) ═══════════════════════════ */
function makeLocal() {
  const K = 'rimail_local_v2';
  let authCb = () => {}; const subs = new Set();
  const load = () => { try { const d = JSON.parse(localStorage.getItem(K)); if (d && d.users) return d; } catch {} return { users:{}, mails:{}, session:null }; };
  const emit = () => subs.forEach(f => f());
  const store = d => { localStorage.setItem(K, JSON.stringify(d)); emit(); };
  window.addEventListener('storage', e => { if (e.key === K) emit(); });
  const b64 = u8 => btoa(String.fromCharCode(...u8));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(pass, salt) {
    if (!crypto.subtle) throw { code: 'rimail/insecure' };
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return b64(new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, k, 256)));
  }
  const userObj = (d, u) => ({ uid:u, username:u, name:d.users[u].name, address:u + '@' + DOMAIN, profile:d.users[u].profile });
  const me = d => d.session && d.users[d.session] ? d.session : null;
  return {
    name: 'local',
    onAuth(cb) { authCb = cb; const d = load(); const u = me(d); cb(u ? userObj(d, u) : null); },
    async signUp(name, u, p) {
      let d = load(); if (d.users[u]) throw { code:'auth/email-already-in-use' };
      const salt = crypto.getRandomValues(new Uint8Array(16)); const hash = await derive(p, salt);
      d = load(); if (d.users[u]) throw { code:'auth/email-already-in-use' };
      d.users[u] = { name, salt:b64(salt), hash, profile:{ labels:[], settings:{}, plan:'free' } }; d.mails[u] = {}; d.session = u; store(d); authCb(userObj(d, u));
    },
    async signIn(u, p) {
      const d = load(); const x = d.users[u];
      if (!x) { await derive(p, new Uint8Array(16)); throw { code:'auth/invalid-credential' }; }
      if (await derive(p, unb64(x.salt)) !== x.hash) throw { code:'auth/invalid-credential' };
      d.session = u; store(d); authCb(userObj(d, u));
    },
    async signOut() { const d = load(); d.session = null; store(d); authCb(null); },
    watch(cb) { const f = () => { const d = load(), u = me(d); cb(u ? Object.values(d.mails[u] || {}) : []); }; subs.add(f); f(); return () => subs.delete(f); },
    async save(m) { const d = load(), u = me(d); if (!u) return; (d.mails[u] ||= {})[m.id] = clean(m); store(d); },
    async patch(id, p) { const d = load(), u = me(d); if (!u || !d.mails[u]?.[id]) return; Object.assign(d.mails[u][id], clean({ ...d.mails[u][id], ...p })); store(d); },
    async remove(id) { const d = load(), u = me(d); if (!u) return; delete d.mails[u]?.[id]; store(d); },
    async deliver(users, m) {
      const d = load(), failed = [];
      for (const un of users) { if (!d.users[un]) { failed.push(un); continue; } const c = inboxCopy(m); (d.mails[un] ||= {})[c.id] = c; }
      store(d); return failed;
    },
    async saveProfile(p) { const d = load(), u = me(d); if (!u) return; d.users[u].profile = { ...d.users[u].profile, ...p }; store(d); }
  };
}

/* ═══════════════════════════ الواجهة الخلفية: Firebase ═══════════════════════════ */
async function makeFirebase() {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG), auth = Au.getAuth(app), db = F.getFirestore(app);
  let pending = Promise.resolve(), cur = null;
  const mdoc = id => F.doc(db, 'mailboxes', cur.uid, 'mails', id);
  return {
    name: 'firebase',
    onAuth(cb) {
      Au.onAuthStateChanged(auth, async fu => {
        await pending;
        if (!fu) { cur = null; cb(null); return; }
        let prof = {};
        try { const s = await F.getDoc(F.doc(db, 'users', fu.uid)); prof = s.exists() ? s.data() : {}; } catch (e) { console.error(e); }
        const username = String(fu.email || '').split('@')[0];
        cur = { uid:fu.uid, username, name:prof.name || fu.displayName || username, address:fu.email,
          profile:{ labels:prof.labels || [], settings:prof.settings || {}, seeded:!!prof.seeded, plan:prof.plan || 'free' } };
        cb(cur);
      });
    },
    async signUp(name, u, p) {
      let done; pending = new Promise(r => done = r);
      try {
        const cred = await Au.createUserWithEmailAndPassword(auth, u + '@' + DOMAIN, p);
        try {
          await F.setDoc(F.doc(db, 'usernames', u), { uid:cred.user.uid, name });
          await F.setDoc(F.doc(db, 'users', cred.user.uid), { name, username:u, labels:[], settings:{}, plan:'free' });
        } catch (e) { try { await Au.deleteUser(cred.user); } catch {} throw { code:'auth/email-already-in-use' }; }
        try { await Au.updateProfile(cred.user, { displayName:name }); } catch {}
      } finally { done(); }
    },
    signIn: (u, p) => Au.signInWithEmailAndPassword(auth, u + '@' + DOMAIN, p),
    signOut: () => Au.signOut(auth),
    watch(cb) { return F.onSnapshot(F.collection(db, 'mailboxes', cur.uid, 'mails'), s => cb(s.docs.map(d => ({ ...d.data(), id:d.id }))), e => console.error(e)); },
    save: m => F.setDoc(mdoc(m.id), clean(m)),
    patch: (id, p) => F.updateDoc(mdoc(id), JSON.parse(JSON.stringify(p))),
    remove: id => F.deleteDoc(mdoc(id)),
    async deliver(users, m) {
      const failed = [];
      await Promise.all(users.map(async u => {
        try {
          const s = await F.getDoc(F.doc(db, 'usernames', u));
          if (!s.exists()) { failed.push(u); return; }
          const c = inboxCopy(m); await F.setDoc(F.doc(db, 'mailboxes', s.data().uid, 'mails', c.id), c);
        } catch (e) { console.error(e); failed.push(u); }
      }));
      return failed;
    },
    saveProfile: p => F.setDoc(F.doc(db, 'users', cur.uid), JSON.parse(JSON.stringify(p)), { merge:true })
  };
}

/* ═══════════════════════════ الحالة ═══════════════════════════ */
const S = { user:null, mails:[], byId:new Map(), profile:{ labels:[], settings:{} }, view:'inbox', openId:null, cat:'primary', query:'', sel:new Set(), details:false };
let Backend, unsub = null, C = null, purged = false, lastReader = '';
const plan = () => PLANS[S.profile?.plan] || PLANS.free;

/* ═══════════════════════════ المظهر ═══════════════════════════ */
function applyTheme() {
  let t = 'auto'; try { t = localStorage.getItem('rimail_theme') || 'auto'; } catch {}
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#131314' : '#f6f8fc';
}

/* ═══════════════════════════ عناصر الواجهة العامة ═══════════════════════════ */
let snackT;
function snack(text, action, ms = 5000) {
  const el = $('#snack'); el.innerHTML = `<span>${esc(text)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  el.classList.add('show');
  if (action) el.querySelector('button').onclick = () => { hideSnack(); action.fn(); };
  clearTimeout(snackT); snackT = setTimeout(hideSnack, ms);
}
const hideSnack = () => $('#snack').classList.remove('show');

function closeDialog() { $('#dialogHost').innerHTML = ''; }
function dialog({ title, html = '', actions = [], onOpen }) {
  const h = $('#dialogHost');
  h.innerHTML = `<div class="dlg-back"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="dlg-body">${html}</div><div class="dlg-actions"></div></div></div>`;
  const back = h.firstElementChild, box = back.firstElementChild, acts = box.querySelector('.dlg-actions');
  actions.forEach(a => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = a.text; b.className = a.primary ? 'btn primary' : 'btn';
    b.onclick = async () => { const r = a.fn ? await a.fn(box) : undefined; if (r !== false) closeDialog(); };
    acts.append(b);
  });
  back.addEventListener('mousedown', e => { if (e.target === back) closeDialog(); });
  onOpen && onOpen(box); return box;
}
function askText(title, placeholder, value, cb) {
  dialog({ title, html: `<input type="text" id="dlg-in" maxlength="40" placeholder="${esc(placeholder)}" value="${esc(value)}">`,
    actions: [{ text:'إلغاء' }, { text:'حفظ', primary:true, fn: box => { const v = box.querySelector('#dlg-in').value.trim(); if (!v) return false; cb(v); } }],
    onOpen: box => { const i = box.querySelector('#dlg-in'); i.focus(); i.select(); i.addEventListener('keydown', e => { if (e.key === 'Enter') box.querySelector('.btn.primary').click(); }); } });
}
function confirmDlg(title, text, okText, fn) {
  dialog({ title, html: esc(text), actions: [{ text:'إلغاء' }, { text:okText, primary:true, fn }] });
}

const fixRect = el => { const r = el.getBoundingClientRect(); return { getBoundingClientRect: () => r }; };
function closeMenu() { $('#menuHost').innerHTML = ''; }
function showMenu(anchor, items, header) {
  closeMenu(); const h = $('#menuHost'), m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = (header || '') + items.map((it, i) => it.divider ? '<div class="menu-div"></div>' :
    `<button type="button" class="menu-item" role="menuitem" data-i="${i}">${it.checked !== undefined ? `<span class="mchk">${it.checked ? I('check') : ''}</span>` : (it.icon ? I(it.icon) : '')}<span>${esc(it.text)}</span></button>`).join('');
  h.append(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, hh = m.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w), innerWidth - w - 8); let top = r.bottom + 4;
  if (top + hh > innerHeight - 8) top = Math.max(8, r.top - hh - 4);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('.menu-item'); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); it.fn && it.fn(); });
}
document.addEventListener('mousedown', e => { if (!e.target.closest('.menu')) closeMenu(); });

/* ═══════════════════════════ التوجيه ═══════════════════════════ */
function parseHash() {
  const p = location.hash.replace(/^#!?\/?/, '').split('/');
  let v = 'inbox'; try { v = decodeURIComponent(p[0] || '') || 'inbox'; } catch {}
  let id = null; try { id = p[1] ? decodeURIComponent(p[1]) : null; } catch {}

const sendLog = () => { try { return JSON.parse(localStorage.getItem('rimail_sends_' + S.user.uid) || '[]').filter(t => now() - t < 3600e3); } catch { return []; } };
function sendMail() {
  C.commitAll(); C.readFields();
  const all = [...new Set([...C.to, ...C.cc, ...C.bcc])];
  if (!all.length) { snack('أضف مستلمًا واحدًا على الأقل'); return; }
  const bad = all.filter(a => !validAddr(a)); if (bad.length) { snack('عنوان غير صالح: ' + bad[0]); return; }
  if (all.length > plan().maxRecipients) { snack(`الحد الأقصى ${plan().maxRecipients} مستلمًا في الرسالة الواحدة`); return; }
  if (sendLog().length >= plan().sendsPerHour) { snack('وصلت إلى حد الإرسال في الساعة. حاول لاحقًا.'); return; }
  const go2 = () => {

  };

}
async function finalizeSend(mail) {
  mail = { ...mail, ts:now() };
  const rec = [...new Set([...mail.to, ...mail.cc, ...mail.bcc])];
  let failed = [];
  try { failed = await Backend.deliver(rec.map(local), mail); } catch (e) { console.error(e); failed = rec.map(local); }
  try { const l = sendLog(); l.push(now()); localStorage.setItem('rimail_sends_' + S.user.uid, JSON.stringify(l)); } catch {}
  await Backend.save({ ...mail, folder:'sent', read:true });
  if (failed.length) {
    await Backend.save({ ...blank(), id:uid(), from:'mailer-daemon@' + DOMAIN, fromName:'Mail Delivery Subsystem', to:[S.user.address], ts:now(),
      subject:'تعذّر تسليم الرسالة: ' + (mail.subject || '(بدون موضوع)'),
      body:`لم يتم تسليم رسالتك إلى:\n${failed.map(u => u + '@' + DOMAIN).join('\n')}\n\nالسبب: العنوان غير موجود أو تعذّر الوصول إليه.` });
    snack('تعذّر تسليم الرسالة إلى بعض المستلمين');
  } else snack('تم إرسال الرسالة', { label:'عرض', fn: () => go('sent', mail.id) });
}
function replyTo(m, mode) {
  const me = S.user.address, own = m.from === me, pre = (p, s) => new RegExp('^' + p + ':', 'i').test(s) ? s : p + ': ' + s;
  const quote = `${sigText()}\n\nفي ${fmtFull(m.ts)}، ${m.fromName || m.from} <${m.from}> كتب:\n` + m.body.split('\n').map(l => '> ' + l).join('\n');
  if (mode === 'forward') return openCompose({ subject:pre('Fwd', m.subject), body:`${sigText()}\n\n---------- رسالة محوّلة ----------\nمن: ${m.fromName} <${m.from}>\nالتاريخ: ${fmtFull(m.ts)}\nالموضوع: ${m.subject}\nإلى: ${m.to.join(', ')}\n\n${m.body}` });

  openCompose({ to, cc, subject:pre('Re', m.subject), body:quote });
}

  if (unsub) { unsub(); unsub = null; }
  S.user = u; S.sel.clear(); S.openId = null; closeMenu(); closeDialog();
  if (!u) { S.mails = []; S.byId = new Map(); purged = false; $('#app').hidden = true; $('#auth').hidden = false; $('#a-pass').value = ''; $('#a-name').value = ''; setMode('login'); closeCompose(false); document.body.classList.remove('reading'); document.title = 'Rimail'; return; }
  S.profile = { labels:[], settings:{}, plan:'free', ...u.profile };
  $('#auth').hidden = true; $('#app').hidden = false;
  const av = $('#avatar'); av.textContent = initial(u.name); av.style.background = colorOf(u.username);
  unsub = Backend.watch(list => {
    S.mails = list.map(norm); S.byId = new Map(S.mails.map(m => [m.id, m]));
    if (!purged) { purged = true; S.mails.filter(m => (m.folder === 'trash' || m.folder === 'spam') && m.trashedAt && now() - m.trashedAt > 30 * 864e5).forEach(m => Backend.remove(m.id)); }
    render();
  });
  if (!S.profile.seeded) { S.profile.seeded = true; try { await Promise.all(seedMails(u).map(m => Backend.save(m))); await Backend.saveProfile({ seeded:true }); } catch (e) { console.error(e); } }
  route();
}

let authMode = 'login';
const setErr = t => { $('#a-err').textContent = t || ''; };
function setMode(m) {
  authMode = m; const su = m === 'signup';
  $('#f-name').hidden = !su; $('#auth-sub').textContent = su ? 'إنشاء حساب Rimail' : 'تسجيل الدخول';
  $('#a-switch').textContent = su ? 'لدي حساب' : 'إنشاء حساب'; $('#a-submit').textContent = su ? 'إنشاء' : 'التالي';
  $('#a-pass').autocomplete = su ? 'new-password' : 'current-password'; setErr('');
}
function errMsg(e) {
  const c = e && e.code || '';
  if (c === 'auth/email-already-in-use') return 'اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر.';
  if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)) return 'اسم المستخدم أو كلمة المرور غير صحيحة.';
  if (c === 'auth/too-many-requests') return 'محاولات كثيرة. حاول لاحقًا.';
  if (c === 'auth/network-request-failed') return 'تعذّر الاتصال بالإنترنت.';
  if (c === 'auth/weak-password') return 'كلمة المرور ضعيفة.';
  if (c === 'rimail/insecure') return 'يتطلب هذا الوضع اتصالًا آمنًا (HTTPS).';
  return 'حدث خطأ غير متوقع. حاول مرة أخرى.';
}
function bindAuth() {
  $('#a-switch').onclick = () => setMode(authMode === 'login' ? 'signup' : 'login');
  $('#auth-form').addEventListener('submit', async e => {
    e.preventDefault(); setErr('');
    const name = $('#a-name').value.trim().replace(/[\u0000-\u001f]/g, '').slice(0, 40), u = $('#a-user').value.trim().toLowerCase().replace(new RegExp('@' + DOMAIN.replace('.', '\\.') + '$'), ''), p = $('#a-pass').value;
    if (!validUser(u)) return setErr('اسم المستخدم: من 3 إلى 30 خانة (حروف إنجليزية صغيرة وأرقام و . و _).');
    if (authMode === 'signup') { if (!name) return setErr('أدخل اسمك.'); if (p.length < 8) return setErr('كلمة المرور يجب ألا تقل عن 8 خانات.'); }
    else if (!p) return setErr('أدخل كلمة المرور.');
    const btn = $('#a-submit'); btn.disabled = true;
    try { authMode === 'signup' ? await Backend.signUp(name, u, p) : await Backend.signIn(u, p); }
    catch (err) { setErr(errMsg(err)); }
    finally { btn.disabled = false; }
  });
}
function installManifest() {
  try {
    const svg = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" fill="#f6f8fc"/><rect x="4" y="9" width="40" height="30" rx="6" fill="#d93025"/><path d="M6 14l18 14 18-14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    const mf = { name:'Rimail', short_name:'Rimail', display:'standalone', dir:'rtl', lang:'ar', background_color:'#f6f8fc', theme_color:'#d93025', start_url:location.href.split('#')[0], icons:[{ src:svg, sizes:'any', type:'image/svg+xml', purpose:'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/manifest+json' })); document.head.append(l);
  } catch {}
}
async function boot() {
  applyTheme(); installManifest(); bindAuth(); bindEvents(); setMode('login');
  if (!USE_FIREBASE) { const n = $('#demo-note'); n.hidden = false; n.textContent = 'وضع تجريبي: البيانات تُحفظ في هذا المتصفح فقط ولا تُشارك مع مستخدمين آخرين. لتفعيل الحسابات الحقيقية والإرسال بين المستخدمين أضف إعدادات Firebase داخل الملف.'; }
  try { Backend = USE_FIREBASE ? await makeFirebase() : makeLocal(); }
  catch (e) { console.error(e); $('#auth').hidden = false; setErr('تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم أعد تحميل الصفحة.'); return; }
  Backend.onAuth(onAuth);
}
boot();
</script>
