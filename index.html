<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Rimail — بريد إلكتروني عائلي">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Rimail">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-JwZj4CPdltK9Gyg35GDkolq5D6PkOOyVLvWVNPwHnA0=' 'sha256-IlCNbFlKoAGG1xMXd8RlGhyfoZ1mj93OOrMvrz1SmMk=' https://www.gstatic.com https://apis.google.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com; media-src data: blob: https://res.cloudinary.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://api.cloudinary.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com https://*.web.app; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rimail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f8fc;--surface:#fff;--read:#eef2f9;--text:#1f1f1f;--sub:#444746;--accent:#d3e3fd;--accent-text:#041e49;
  --border:#e0e2e0;--search:#eaf1fb;--fab:#c2e7ff;--fab-text:#001d35;--brand:#d93025;--pri:#0b57d0;--pri-t:#fff;--star:#f4b400;
  --hover:rgba(31,31,31,.08);--danger:#b3261e;--overlay:rgba(0,0,0,.4);--snack:#303030;--snack-text:#f2f2f2;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#131314;--surface:#1e1f20;--read:#191a1b;--text:#e3e3e3;--sub:#c4c7c5;--accent:#004a77;--accent-text:#c2e7ff;
  --border:#444746;--search:#2d2f31;--fab:#004a77;--fab-text:#c2e7ff;--brand:#f28b82;--hover:rgba(255,255,255,.1);
  --danger:#f2b8b5;--overlay:rgba(0,0,0,.6);--snack:#e3e3e3;--snack-text:#1f1f1f;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.material-symbols-outlined.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.btn{padding:9px 22px;border-radius:20px;font-weight:600;color:var(--pri)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--pri);color:var(--pri-t)}
.btn.primary:hover{background:#0a4cb8}
[data-theme=dark] .btn{color:var(--pri)}[data-theme=dark] .btn.primary{background:var(--pri);color:var(--pri-t)}
.grow{flex:1}

/* ===== شاشة الدخول ===== */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow:auto;z-index:500}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:36px 28px;width:100%;max-width:420px}
.auth-card .logo{width:52px;height:52px;margin:0 auto 8px;display:block}
.auth-card h1{text-align:center;font-size:1.5rem;font-weight:600}
.auth-card p.sub{text-align:center;color:var(--sub);margin:6px 0 22px}
.field{margin-bottom:14px}
.field input{width:100%;padding:14px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;outline:none}
.field input:focus,.addr:focus-within{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.addr{display:flex;direction:ltr;align-items:center;border:1px solid var(--border);border-radius:8px;padding-inline-end:12px}
.addr input{border:none!important;box-shadow:none!important;flex:1;min-width:0;direction:ltr;text-align:left}
.addr span{color:var(--sub);white-space:nowrap}
.err{color:var(--danger);font-size:.85rem;min-height:1.3em;margin-bottom:8px}
.auth-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.demo-note{margin-top:20px;font-size:.78rem;color:var(--sub);background:var(--read);padding:10px 12px;border-radius:12px;line-height:1.7}

/* ===== الهيكل ===== */
#app{display:flex;height:100vh;height:100dvh}
.drawer{position:fixed;top:0;bottom:0;right:0;width:288px;max-width:86vw;background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:8px 0 24px;visibility:hidden}
body.drawer-open .drawer{transform:none;visibility:visible;box-shadow:0 0 24px rgba(0,0,0,.3)}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:90;display:none}
.overlay:not([hidden]){display:block}
.brand{display:flex;align-items:center;gap:10px;padding:12px 24px;font-size:1.35rem;font-weight:700;color:var(--brand)}
.brand svg{width:34px;height:34px}
.fab-spacer{display:none}
.nav-item{display:flex;align-items:center;gap:18px;height:40px;padding:0 24px;margin-inline-end:12px;border-radius:0 20px 20px 0;color:var(--text);cursor:pointer;font-size:.92rem;width:calc(100% - 12px);text-align:start}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent);color:var(--accent-text);font-weight:700}
.nav-item .cnt{margin-inline-start:auto;font-size:.8rem;font-weight:600}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sep{height:1px;background:var(--border);margin:8px 16px}
.nav-head{display:flex;align-items:center;padding:6px 24px;color:var(--sub);font-size:.85rem;font-weight:600}
.lm{opacity:.0;width:32px;height:32px}
.nav-item:hover .lm,.nav-item.active .lm{opacity:1}
@media(hover:none){.lm{opacity:1}}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{padding:8px 12px calc(4px) 12px;display:flex;align-items:center;min-height:64px}
#searchbar,#selbar{width:100%;max-width:760px;height:48px;border-radius:24px;display:flex;align-items:center;gap:4px;padding:0 6px}
#searchbar{background:var(--search)}
#searchbar:focus-within{background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.3)}
#q{border:none;background:transparent;flex:1;min-width:0;outline:none;font-size:1rem;height:100%}
#q::placeholder{color:var(--sub)}
#selbar{background:var(--accent);color:var(--accent-text);max-width:none}
#selbar .icon-btn{color:var(--accent-text)}
.sel-count{font-weight:700;font-size:1.1rem;margin-inline-start:6px}
.avatar{width:34px;height:34px;border-radius:50%;background:#8d6e63;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;cursor:pointer;flex-shrink:0;margin-inline-start:2px}
.desk-only{display:none}

.panel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:18px;color:var(--sub);font-weight:600;font-size:.88rem;white-space:nowrap;border:1px solid transparent}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--accent);color:var(--accent-text)}
.tab .b{background:var(--brand);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px}
.list{flex:1;overflow-y:auto;padding:0 12px calc(96px + var(--safe-b))}
.section-title{font-size:.85rem;color:var(--sub);margin:10px 4px 8px;font-weight:600}
.banner{background:var(--surface);border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-size:.85rem;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner button{color:var(--pri);font-weight:600}
[data-theme=dark] .banner button{color:var(--pri)}
.empty{text-align:center;color:var(--sub);padding:70px 20px}
.empty .material-symbols-outlined{font-size:72px;opacity:.5;display:block;margin:0 auto 10px}

.swipe{position:relative;border-radius:16px;overflow:hidden;margin-bottom:8px;background:#188038}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}
.email-item{position:relative;background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;touch-action:pan-y}
.email-item:not(.unread){background:var(--read)}
.email-item.sel{background:var(--accent)!important}
.sender-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.05rem;flex-shrink:0}
.email-item.sel .sender-avatar{background:var(--pri)!important}
.email-content{flex:1;min-width:0}
.email-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sender-name{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-date{font-size:.74rem;color:var(--sub);white-space:nowrap}
.email-subject{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.email-snippet{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .sender-name,.unread .email-subject{font-weight:700}
.unread .email-date{color:var(--text);font-weight:700}
.draft-tag{color:var(--danger);font-weight:600}
.chip-l,.chip-s{display:inline-flex;align-items:center;gap:3px;background:var(--search);color:var(--sub);border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:600;margin-inline-end:4px;vertical-align:middle}
.chip-s .material-symbols-outlined{font-size:12px}
.star-btn{color:var(--sub);margin-top:2px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.star-btn:hover{background:var(--hover)}
.star-btn.on{color:var(--star)}

.fab{position:fixed;bottom:calc(20px + var(--safe-b));left:16px;background:var(--fab);color:var(--fab-text);padding:16px 20px;border-radius:16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:.95rem;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:10;transition:padding .2s}
.fab.mini{padding:16px}
.fab.mini .fab-text{display:none}
body.reading .fab{display:none}

/* ===== القارئ ===== */
.reader{position:fixed;inset:0;background:var(--surface);z-index:60;display:flex;flex-direction:column}
.r-bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.r-scroll{flex:1;overflow-y:auto;padding:16px 18px 40px}
.r-subject{display:flex;align-items:flex-start;gap:8px}
.r-subject h1{font-size:1.35rem;font-weight:600;line-height:1.5;flex:1;word-break:break-word}
.r-labels{margin:6px 0 4px}
.r-sender{display:flex;gap:12px;align-items:flex-start;margin:16px 0 8px}
.r-meta{flex:1;min-width:0}
.r-meta b{font-size:.95rem}
.r-meta small{color:var(--sub);margin-inline-start:6px}
.r-to{color:var(--sub);font-size:.82rem;display:flex;align-items:center;gap:2px;cursor:pointer;width:fit-content}
.r-to .material-symbols-outlined{font-size:18px}
.r-details{background:var(--read);border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-size:.82rem;line-height:1.9;color:var(--sub);word-break:break-all}
.r-details b{color:var(--text);margin-inline-end:6px}
.r-body{white-space:pre-wrap;word-break:break-word;line-height:1.8;margin:14px 0 24px;font-size:.95rem}
.r-body a{color:var(--pri)}[data-theme=dark] .r-body a{color:var(--pri)}
.r-actions{display:flex;gap:10px;flex-wrap:wrap}
.r-actions button{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-weight:600;color:var(--sub)}
.r-actions button:hover{background:var(--hover)}
.r-trash-note{background:var(--read);padding:8px 16px;font-size:.82rem;color:var(--sub)}

/* ===== النوافذ المنبثقة ===== */
.compose{position:fixed;inset:0;background:var(--surface);z-index:120;display:flex;flex-direction:column}
.c-head{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;background:var(--read);border-bottom:1px solid var(--border);font-weight:600}
.c-head .c-title{flex:1}
.c-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:0 14px}
.c-row{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--border);padding:6px 0;min-height:44px}
.c-row>label{color:var(--sub);font-size:.85rem;width:44px;flex-shrink:0;padding-top:7px}
.c-from{padding-top:7px;color:var(--sub);font-size:.88rem;direction:ltr;unicode-bidi:plaintext}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.chips input{flex:1;min-width:110px;border:none;background:transparent;outline:none;padding:6px 0;direction:ltr;text-align:left}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--search);border-radius:14px;padding:2px 4px 2px 10px;font-size:.82rem;direction:ltr}
.chip.bad{background:#f9dedc;color:#8c1d18}
.chip button{width:20px;height:20px;border-radius:50%;line-height:1;font-size:1rem;color:inherit}
.chip button:hover{background:var(--hover)}
#c-subj{flex:1;border:none;background:transparent;outline:none;padding:7px 0;min-width:0}
#c-text{flex:1;min-height:200px;border:none;background:transparent;outline:none;resize:none;padding:12px 0;line-height:1.8}
.c-foot{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + var(--safe-b));border-top:1px solid var(--border)}
.c-foot .send{background:var(--pri);color:#fff;border-radius:20px;padding:9px 26px;font-weight:700;display:flex;align-items:center;gap:6px}
[data-theme=dark] .c-foot .send{background:var(--pri);color:var(--pri-t)}
#c-status{font-size:.78rem;color:var(--sub)}
.compose.min .c-body,.compose.min .c-foot{display:none}

.dlg-back{position:fixed;inset:0;background:var(--overlay);z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.dlg h3{font-weight:600;margin-bottom:14px;font-size:1.15rem}
.dlg-body{color:var(--sub);line-height:1.8}
.dlg-body input[type=text],.dlg-body input[type=datetime-local],.dlg-body textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:transparent;outline:none;margin-top:6px;color:var(--text)}
.dlg-body textarea{min-height:90px;resize:vertical;line-height:1.7}
.dlg-body label.opt{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text);cursor:pointer}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.menu{position:fixed;z-index:200;background:var(--surface);border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.3);min-width:220px;max-width:calc(100vw - 16px);max-height:70vh;overflow-y:auto;padding:6px 0}
[data-theme=dark] .menu{background:#2d2f31}
.menu-head{padding:14px 18px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu-head b{display:block}.menu-head span{color:var(--sub);font-size:.82rem;direction:ltr;display:block;text-align:right;unicode-bidi:plaintext}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:10px 18px;text-align:start;font-size:.9rem}
.menu-item:hover{background:var(--hover)}
.menu-item .material-symbols-outlined{font-size:20px;color:var(--sub)}
.mchk{width:20px;display:inline-flex}
.menu-div{height:1px;background:var(--border);margin:6px 0}
.snack{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--snack);color:var(--snack-text);border-radius:8px;padding:12px 18px;display:flex;align-items:center;gap:20px;z-index:300;transition:.25s;font-size:.9rem;max-width:92vw}
.snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{color:#8ab4f8;font-weight:700;white-space:nowrap}
[data-theme=dark] .snack button{color:var(--pri)}

/* ===== الشاشات الكبيرة ===== */
@media (min-width:900px){
  .drawer{position:static;transform:none;visibility:visible;box-shadow:none;width:256px;flex-shrink:0;padding-top:0}
  .overlay{display:none!important}
  .fab-spacer{display:block;height:72px}
  .fab{position:fixed;top:76px;right:16px;left:auto;bottom:auto;padding:16px 22px 16px 24px;z-index:105}
  .fab.mini{padding:16px 22px 16px 24px}.fab.mini .fab-text{display:inline}
  #menu-btn{display:none}.desk-only{display:inline-flex}
  .top{padding-inline:8px 24px}
  .panel{background:var(--surface);border-radius:16px;margin:0 0 16px 16px}
  .list{padding:0 0 20px}
  .tabs{padding:0 8px;border-bottom:1px solid var(--border)}
  .tab{border-radius:0;border-bottom:3px solid transparent;padding:14px 20px}
  .tab.active{background:none;border-bottom-color:var(--pri);color:var(--pri)}
  .tab:hover{background:var(--hover)}
  [data-theme=dark] .tab.active{color:var(--pri);border-bottom-color:var(--pri)}
  .section-title{margin:14px 16px 6px}
  .banner{margin:6px 16px 10px}
  .swipe{border-radius:0;margin:0;background:transparent}
  .swipe-bg{display:none}
  .email-item{display:grid;grid-template-columns:32px 36px 180px 1fr auto;align-items:center;gap:10px;padding:0 16px;height:46px;border-bottom:1px solid var(--border)}
  .email-item:hover{box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:1}
  .sender-avatar{width:28px;height:28px;font-size:.8rem}
  .email-content{display:contents}
  .email-header{display:contents}
  .sender-name{grid-column:3;grid-row:1}
  .email-subject{display:none}
  .email-snippet{display:none}
  .email-date{grid-column:5;grid-row:1}
  .email-item .star-btn{grid-column:2;grid-row:1;margin:0}
  .email-item .ds{grid-column:4;grid-row:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
  .email-item .ds .sn{color:var(--sub);font-weight:400}
  .reader{position:absolute;border-radius:16px}
  .compose{inset:auto auto 0 24px;width:540px;height:min(580px,calc(100vh - 40px));border-radius:12px 12px 0 0;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:120}
  .compose.min{height:auto}
  .r-scroll{padding:20px 64px 40px}
}
@media (max-width:899px){.email-item .ds{display:none}}
@media print{#app>aside,.top,.tabs,.list,.fab,.r-bar,.r-actions,#snack{display:none!important}.reader{position:static!important}body{overflow:visible}}

/* ═════ الألوان الأساسية ═════ */
:root{--pri:#0b57d0;--pri-t:#fff;--accent:color-mix(in srgb,var(--pri) 16%,var(--surface));--accent-text:var(--pri);--fab:color-mix(in srgb,var(--pri) 20%,var(--surface));--fab-text:var(--pri);--search:color-mix(in srgb,var(--text) 6%,var(--bg))}
[data-accent=red]{--pri:#c5221f;--brand:#d93025}[data-accent=blue]{--pri:#0b57d0}[data-accent=pink]{--pri:#c2185b}[data-accent=purple]{--pri:#7b1fa2}[data-accent=teal]{--pri:#00796b}[data-accent=green]{--pri:#188038}[data-accent=orange]{--pri:#c2410c}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
const uid = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36); };
const now = () => Date.now();
const I = (n, c = '') => `<span class="material-symbols-outlined ${c}" aria-hidden="true">${n}</span>`;
const COLORS = ['#8d6e63', '#1a73e8', '#188038', '#b45309', '#8e24aa', '#d93025', '#007b83', '#c2185b', '#5f6368'];
const colorOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const initial = s => ([...String(s || '').trim()][0] || '?').toUpperCase();
const local = a => String(a).split('@')[0];
const ADDR_RE = new RegExp('^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]@' + DOMAIN.replace('.', '\\.') + '$');
const validAddr = a => ADDR_RE.test(a);
const validUser = u => /^[a-z0-9][a-z0-9._]{1,28}[a-z0-9]$/.test(u);
const EMAIL_RE = /^[^\s@<>()\[\],;:"]{1,64}@[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i;
const validEmail = a => a.length <= 120 && EMAIL_RE.test(a);
const isInternal = a => String(a).toLowerCase().endsWith('@' + DOMAIN);
const clamp = (n, a, b) => Math.min(Math.max(n, a), b);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const uniq = a => [...new Set(a)];

function fmtDate(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString(LOCALE, { hour: 'numeric', minute: '2-digit' });
  if (d.getFullYear() === n.getFullYear()) return d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' });
  return d.toLocaleDateString(LOCALE, { year: '2-digit', month: 'numeric', day: 'numeric' });
}
const fmtFull = ts => new Date(ts).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' });
const fmtSize = n => n < 1024 ? n + ' بايت' : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' ك.ب' : (n / 1048576).toFixed(1) + ' م.ب';
const pad2 = x => String(x).padStart(2, '0');
const toLocalInput = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

const KEEP = new Set(['A', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'BR', 'P', 'DIV', 'SPAN', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'PRE', 'CODE', 'HR', 'FONT', 'SUB', 'SUP', 'TABLE', 'TBODY', 'THEAD', 'TR', 'TD', 'TH']);
const COLOR_RE = /^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\)|[a-z]{3,20})$/i;
const STYLE_OK = {
  'color': COLOR_RE, 'background-color': COLOR_RE, 'font-size': /^\d{1,2}(\.\d+)?(px|pt|em|rem|%)$/,
  'font-weight': /^(normal|bold|[1-9]00)$/, 'font-style': /^(normal|italic)$/, 'text-decoration': /^(none|underline|line-through)( (underline|line-through))?$/,
  'text-align': /^(left|right|center|justify|start|end)$/, 'direction': /^(rtl|ltr)$/
};
function cleanStyle(s) {
  return String(s).split(';').map(x => x.trim()).filter(Boolean).map(d => {
    const i = d.indexOf(':'); if (i < 1) return '';
    const k = d.slice(0, i).trim().toLowerCase(), v = d.slice(i + 1).trim();
    return STYLE_OK[k] && STYLE_OK[k].test(v) ? `${k}:${v}` : '';
  }).filter(Boolean).join(';');
}
function sanitizeHTML(html, opts = {}) {
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + String(html || ''), 'text/html');
  const walk = node => {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 3) continue;
      if (ch.nodeType !== 1) { ch.remove(); continue; }
      const tag = ch.tagName;
      if (DROP.has(tag)) { ch.remove(); continue; }
      walk(ch);
      if (!KEEP.has(tag) || (tag === 'A' && opts.noLinks)) { while (ch.firstChild) node.insertBefore(ch.firstChild, ch); ch.remove(); continue; }
      for (const a of [...ch.attributes]) {
        const n = a.name.toLowerCase(), v = a.value;
        if (n === 'style') { const c = cleanStyle(v); c ? ch.setAttribute('style', c) : ch.removeAttribute('style'); }
        else if (n === 'href' && tag === 'A') { /^(https?:|mailto:)/i.test(v.trim()) ? ch.setAttribute('href', v.trim()) : ch.removeAttribute('href'); }
        else if (n === 'dir' && /^(rtl|ltr|auto)$/i.test(v)) { /* مسموح */ }
        else if (n === 'color' && tag === 'FONT' && COLOR_RE.test(v)) { /* مسموح */ }
        else if (n === 'size' && tag === 'FONT' && /^[1-7]$/.test(v)) { /* مسموح */ }
        else if (n === 'class' && tag === 'BLOCKQUOTE' && v === 'q') { /* مسموح */ }
        else ch.removeAttribute(a.name);
      }
      if (tag === 'A') { ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener noreferrer'); }
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
/* نص عادي من HTML (للبحث والمقتطفات) */
function htmlToPlain(html) {
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + String(html || ''), 'text/html'); let out = '';
  const BLOCK = new Set(['P', 'DIV', 'LI', 'BLOCKQUOTE', 'TR', 'H1', 'H2', 'H3', 'PRE', 'UL', 'OL']);
  const walk = n => { for (const c of n.childNodes) { if (c.nodeType === 3) out += c.textContent; else if (c.nodeType === 1) { if (c.tagName === 'BR') out += '\n'; else { const b = BLOCK.has(c.tagName); if (b && out && !out.endsWith('\n')) out += '\n'; walk(c); if (b && !out.endsWith('\n')) out += '\n'; } } } };
  walk(doc.body); return out.replace(/\n{3,}/g, '\n\n').trim();
}

/* ═══ تشفير وملفات ═══ */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function kdf(pass, salt) {
  if (!crypto.subtle) throw { code: 'rimail/insecure' };
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, k, 256)));
}
function download(name, content, type = 'application/octet-stream') {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const fileIcon = t => /^image\//.test(t) ? 'image' : /pdf/.test(t) ? 'picture_as_pdf' : /^video\//.test(t) ? 'movie' : /^audio\//.test(t) ? 'audio_file' : /zip|rar|7z|tar/.test(t) ? 'folder_zip' : /sheet|excel|csv/.test(t) ? 'table_chart' : /word|document|text/.test(t) ? 'description' : 'attach_file';
const safeUrl = u => typeof u === 'string' && (/^https:\/\/res\.cloudinary\.com\//.test(u) || /^data:[a-z]+\/[a-z0-9.+-]+;base64,/i.test(u));

function norm(raw) {

  for (const k of ['to', 'cc', 'bcc', 'labels']) m[k] = Array.isArray(m[k]) ? m[k].filter(x => typeof x === 'string') : [];

  if (!CAT_KEYS.includes(m.category)) m.category = 'primary';

/* ═══════════════════════════ الواجهة الخلفية ═══════════════════════════
   واجهة موحّدة بتنفيذين: محلي (تجريبي بلا إعداد) و Firebase (الإنتاج).
   ══════════════════════════════════════════════════════════════════ */
const newProfile = () => ({
  labels: [], labelMeta: {}, settings: {}, filters: [], contacts: [], blocked: [], templates: [], vacation: {}, family: {},
  seeded: false, avatar: '', phone: '', bio: '', birthday: '', location: '', appLock: {}, loginLog: [], vacationSent: {}
});
const DEF_CONFIG = { signupOpen: true, maintenance: false, motd: '' };

/* ═══ التنفيذ المحلي ═══ */
function makeLocal() {
  const K = 'rimail_local_v4';
  let authCb = () => {}; const subs = new Set(), evSubs = new Set();
  const load = () => {
    try { const d = JSON.parse(localStorage.getItem(K)); if (d && d.users) return d; } catch {}
    return { users: {}, mails: {}, events: {}, reports: [], audit: [], config: { ...DEF_CONFIG }, admin: null, session: null };
  };
  const emit = () => { subs.forEach(f => f()); evSubs.forEach(f => f()); };
  const store = d => { try { localStorage.setItem(K, JSON.stringify(d)); } catch { throw { code: 'rimail/quota' }; } emit(); };
  window.addEventListener('storage', e => { if (e.key === K) emit(); });
  const me = d => d.session && d.users[d.session] ? d.session : null;
  const userObj = (d, u) => {
    const x = d.users[u];
    return { uid: u, username: u, name: x.name, email: x.email || '', address: u + '@' + DOMAIN, plan: x.plan || 'free', status: x.status || 'active',
      isAdmin: d.admin === u, createdAt: x.createdAt, profile: { ...newProfile(), ...x.profile } };
  };
  const checkPass = async (x, p) => (await kdf(p, unb64(x.salt))) === x.hash;
  const findUser = (d, id) => d.users[id] ? id : Object.keys(d.users).find(u => d.users[u].email && d.users[u].email === id.toLowerCase());
  return {
    name: 'local',
    onAuth(cb) { authCb = cb; const d = load(), u = me(d); cb(u ? userObj(d, u) : null); },
    async getConfig() { return { ...DEF_CONFIG, ...load().config }; },
    async signUp({ name, username, email, password }) {
      let d = load(); if (d.config.signupOpen === false) throw { code: 'rimail/closed' };
      if (d.users[username]) throw { code: 'auth/email-already-in-use' };
      const salt = crypto.getRandomValues(new Uint8Array(16)), hash = await kdf(password, salt);
      d = load(); if (d.users[username]) throw { code: 'auth/email-already-in-use' };
      d.users[username] = { name, email: email || '', salt: b64(salt), hash, profile: newProfile(), plan: 'free', status: 'active', createdAt: now(), lastLogin: now() };
      d.mails[username] = {}; d.events[username] = {}; if (!d.admin) d.admin = username; d.session = username; store(d); authCb(userObj(d, username));
    },
    async signIn(id, p) {
      const d = load(), u = findUser(d, String(id).toLowerCase()), x = u && d.users[u];
      if (!x) { await kdf(p, new Uint8Array(16)); throw { code: 'auth/invalid-credential' }; }
      if (!(await checkPass(x, p))) throw { code: 'auth/invalid-credential' };
      d.session = u; x.lastLogin = now(); store(d); authCb(userObj(d, u));
    },
    async googleSignIn() { throw { code: 'rimail/needs-firebase' }; },
    async claimUsername() { throw { code: 'rimail/needs-firebase' }; },
    async resetPassword() { throw { code: 'rimail/needs-firebase' }; },
    async touch() { const d = load(), u = me(d); if (u) { d.users[u].lastLogin = now(); store(d); } },
    async signOut() { const d = load(); d.session = null; store(d); authCb(null); },
    async idToken() { throw { code: 'rimail/needs-firebase' }; },
    watch(cb) { const f = () => { const d = load(), u = me(d); cb(u ? Object.values(d.mails[u] || {}) : []); }; subs.add(f); f(); return () => subs.delete(f); },
    async save(m) { const d = load(), u = me(d); if (!u) return; (d.mails[u] ||= {})[m.id] = clean(m); store(d); },
    async patch(id, p) { const d = load(), u = me(d); if (!u || !d.mails[u]?.[id]) return; d.mails[u][id] = clean({ ...d.mails[u][id], ...p }); store(d); },
    async remove(id) { const d = load(), u = me(d); if (!u) return; delete d.mails[u]?.[id]; store(d); },
    async removeMany(ids) { const d = load(), u = me(d); if (!u) return; ids.forEach(id => delete d.mails[u]?.[id]); store(d); },
    async deliver(users, m) {
      const d = load(), failed = [], sender = d.users[me(d)];
      if (sender && sender.status !== 'active') throw { code: 'rimail/suspended' };
      for (const un of users) { const x = d.users[un]; if (!x || x.status === 'banned') { failed.push(un); continue; } const c = inboxCopy(m); (d.mails[un] ||= {})[c.id] = c; }
      store(d); return failed;
    },
    watchEvents(cb) { const f = () => { const d = load(), u = me(d); cb(u ? Object.values(d.events[u] || {}) : []); }; evSubs.add(f); f(); return () => evSubs.delete(f); },
    async saveEvent(e) { const d = load(), u = me(d); if (!u) return; (d.events[u] ||= {})[e.id] = e; store(d); },
    async removeEvent(id) { const d = load(), u = me(d); if (!u) return; delete d.events[u]?.[id]; store(d); },
    async saveProfile(p) { const d = load(), u = me(d); if (!u) return; d.users[u].profile = { ...d.users[u].profile, ...p }; store(d); },
    async updatePublic({ name }) { const d = load(), u = me(d); if (!u) return; if (name) d.users[u].name = name; store(d); },
    async lookupPublic(un) { const d = load(), x = d.users[un]; return x ? { name: x.name, avatar: x.profile?.avatar || '' } : null; },
    async changePassword(oldP, newP) {
      const d = load(), u = me(d), x = d.users[u];
      if (!(await checkPass(x, oldP))) throw { code: 'auth/invalid-credential' };
      const salt = crypto.getRandomValues(new Uint8Array(16)); x.salt = b64(salt); x.hash = await kdf(newP, salt); store(d);
    },
    async deleteAccount(pass) {
      const d = load(), u = me(d), x = d.users[u];
      if (!(await checkPass(x, pass))) throw { code: 'auth/invalid-credential' };
      delete d.users[u]; delete d.mails[u]; delete d.events[u]; d.session = null; if (d.admin === u) d.admin = Object.keys(d.users)[0] || null; store(d); authCb(null);
    },
    async importMails(list) {
      const d = load(), u = me(d); if (!u) return 0; let n = 0;
      for (const m of list) { if (m && m.id && !d.mails[u][m.id]) { d.mails[u][m.id] = clean(m); n++; } }
      store(d); return n;
    },
    async report(r) { const d = load(); d.reports.push({ id: uid(), ...r, status: 'open', ts: now() }); store(d); },
    admin: {
      async listUsers() { const d = load(); return Object.keys(d.users).map(u => { const x = d.users[u]; return { uid: u, username: u, name: x.name, plan: x.plan || 'free', status: x.status || 'active', createdAt: x.createdAt, lastLogin: x.lastLogin, mails: Object.keys(d.mails[u] || {}).length }; }); },
      async setUser(id, patch) { const d = load(); if (!d.users[id]) return; Object.assign(d.users[id], patch); store(d); },
      async listReports() { return load().reports.slice().reverse(); },
      async updateReport(id, patch) { const d = load(), r = d.reports.find(x => x.id === id); if (r) Object.assign(r, patch); store(d); },
      async setConfig(patch) { const d = load(); d.config = { ...DEF_CONFIG, ...d.config, ...patch }; store(d); },
      async broadcast(mail, uids) { const d = load(); let n = 0; for (const u of uids) { if (!d.users[u]) continue; (d.mails[u] ||= {})[mail.id + '-' + n] = { ...clean(mail), id: mail.id + '-' + n, folder: 'inbox', read: false, filtered: true }; n++; } store(d); return n; },
      async audit(entry) { const d = load(); d.audit.push({ id: uid(), ts: now(), ...entry }); d.audit = d.audit.slice(-200); store(d); },
      async listAudit() { return load().audit.slice().reverse(); }
    }
  };
}

/* ═══ تنفيذ Firebase ═══ */
async function makeFirebase() {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.initializeAuth(app, { persistence: [Au.indexedDBLocalPersistence, Au.browserLocalPersistence], popupRedirectResolver: Au.browserPopupRedirectResolver });
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { console.warn('offline cache unavailable', e); db = F.getFirestore(app); }
  let pending = Promise.resolve(), cur = null, emitUser = () => {};
  const D = (...p) => F.doc(db, ...p), C = (...p) => F.collection(db, ...p);
  const mdoc = id => D('mailboxes', cur.uid, 'mails', id), mcol = () => C('mailboxes', cur.uid, 'mails');
  const jclean = o => JSON.parse(JSON.stringify(o));
  async function chunked(ids, fn) { for (let i = 0; i < ids.length; i += 400) { const b = F.writeBatch(db); ids.slice(i, i + 400).forEach(id => fn(b, id)); await b.commit(); } }
  const reauth = pass => Au.reauthenticateWithCredential(auth.currentUser, Au.EmailAuthProvider.credential(auth.currentUser.email, pass));
  async function loadUser(fu) {
    const [acc, prof, adm] = await Promise.all([F.getDoc(D('accounts', fu.uid)), F.getDoc(D('users', fu.uid)), F.getDoc(D('admins', fu.uid)).catch(() => null)]);
    if (!acc.exists()) return { uid: fu.uid, username: null, name: fu.displayName || '', email: fu.email || '', photo: fu.photoURL || '', address: null, plan: 'free', status: 'active', isAdmin: false, profile: newProfile() };
    const a = acc.data();
    return { uid: fu.uid, username: a.username, name: a.name, email: fu.email || '', address: a.username + '@' + DOMAIN, plan: a.plan || 'free', status: a.status || 'active',
      isAdmin: !!(adm && adm.exists()), hasPassword: fu.providerData.some(x => x.providerId === 'password'), createdAt: a.createdAt, profile: { ...newProfile(), ...(prof.exists() ? prof.data() : {}) } };
  }
  return {
    name: 'firebase',
    onAuth(cb) {
      emitUser = async () => { const fu = auth.currentUser; if (!fu) { cur = null; cb(null); return; } try { cur = await loadUser(fu); } catch (e) { console.error(e); cur = null; } cb(cur); };
      Au.onAuthStateChanged(auth, async fu => { await pending; if (!fu) { cur = null; cb(null); return; } await emitUser(); });
    },
    async getConfig() { try { const s = await F.getDoc(D('config', 'app')); return { ...DEF_CONFIG, ...(s.exists() ? s.data() : {}) }; } catch { return { ...DEF_CONFIG }; } },
    async claimUsername(username, name) {
      const fu = auth.currentUser, t = now(), b = F.writeBatch(db);
      b.set(D('usernames', username), { uid: fu.uid, name, avatar: '' });
      b.set(D('accounts', fu.uid), { username, name, plan: 'free', status: 'active', createdAt: t, lastLogin: t });
      b.set(D('users', fu.uid), jclean({ ...newProfile(), settings: {} }));
      try { await b.commit(); } catch (e) { throw { code: 'rimail/taken' }; }
      try { await Au.updateProfile(fu, { displayName: name }); } catch {}
      await emitUser();
    },
    async signUp({ name, username, email, password }) {
      let done; pending = new Promise(r => done = r);
      try {
        const cred = await Au.createUserWithEmailAndPassword(auth, email || (username + '@' + DOMAIN), password);
        try { await this.claimUsername(username, name); } catch (e) { try { await Au.deleteUser(cred.user); } catch {} throw e; }
      } finally { done(); }
    },
    signIn: (id, p) => Au.signInWithEmailAndPassword(auth, id.includes('@') ? id : id + '@' + DOMAIN, p),
    async googleSignIn() {
      const pr = new Au.GoogleAuthProvider(); pr.setCustomParameters({ prompt: 'select_account' });
      try { await Au.signInWithPopup(auth, pr); }
      catch (e) { if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) await Au.signInWithRedirect(auth, pr); else throw e; }
    },
    resetPassword: email => Au.sendPasswordResetEmail(auth, email),
    touch: () => F.updateDoc(D('accounts', cur.uid), { lastLogin: now() }).catch(() => {}),
    signOut: () => Au.signOut(auth),
    idToken: () => auth.currentUser.getIdToken(),
    watch(cb) { return F.onSnapshot(mcol(), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), e => console.error(e)); },
    save: m => F.setDoc(mdoc(m.id), clean(m)),
    patch: (id, p) => F.updateDoc(mdoc(id), jclean(p)),
    remove: id => F.deleteDoc(mdoc(id)),
    removeMany: ids => chunked(ids, (b, id) => b.delete(mdoc(id))),
    async deliver(users, m) {
      const failed = [];
      await Promise.all(users.map(async u => {
        try {
          const s = await F.getDoc(D('usernames', u));
          if (!s.exists()) { failed.push(u); return; }
          const c = inboxCopy(m); await F.setDoc(D('mailboxes', s.data().uid, 'mails', c.id), c);
        } catch (e) { console.error(e); failed.push(u); }
      }));
      return failed;
    },
    watchEvents(cb) { return F.onSnapshot(C('calendars', cur.uid, 'events'), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), e => console.error(e)); },
    saveEvent: e => F.setDoc(D('calendars', cur.uid, 'events', e.id), jclean(e)),
    removeEvent: id => F.deleteDoc(D('calendars', cur.uid, 'events', id)),
    saveProfile: p => F.setDoc(D('users', cur.uid), jclean(p), { merge: true }),
    async updatePublic({ name, avatar }) {
      const b = F.writeBatch(db), pub = {}, acc = {};
      if (name) { pub.name = name; acc.name = name; }
      if (avatar !== undefined) pub.avatar = avatar;
      if (Object.keys(pub).length) b.update(D('usernames', cur.username), pub);
      if (Object.keys(acc).length) b.update(D('accounts', cur.uid), acc);
      await b.commit();
      if (name) { try { await Au.updateProfile(auth.currentUser, { displayName: name }); } catch {} }
    },

/* ═══ رفع المرفقات (Cloudinary) ═══ */
function uploadFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    if (USE_CLOUD) {
      const x = new XMLHttpRequest(), fd = new FormData();
      fd.append('file', file); fd.append('upload_preset', CLOUDINARY.uploadPreset);
      x.open('POST', `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY.cloudName)}/auto/upload`);
      x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      x.onload = () => { try { const r = JSON.parse(x.responseText); if (x.status < 300 && r.secure_url) resolve({ url: r.secure_url }); else reject({ code: 'rimail/upload' }); } catch { reject({ code: 'rimail/upload' }); } };
      x.onerror = () => reject({ code: 'rimail/upload' });
      x.send(fd);
    } else if (!USE_FIREBASE) {
      if (file.size > LOCAL_FILE_MAX) { reject({ code: 'rimail/toobig-local' }); return; }
      const r = new FileReader(); r.onload = () => resolve({ url: String(r.result).replace(/^data:;/, 'data:application/octet-stream;') }); r.onerror = () => reject({ code: 'rimail/upload' }); r.readAsDataURL(file);
    } else reject({ code: 'rimail/nocloud' });
  });
}
/* ═══ جسر البريد الخارجي (Cloudflare Worker) ═══ */
async function bridgeSend(payload) {
  const tok = await Backend.idToken();
  const r = await fetch(BRIDGE_URL + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(payload) });
  if (!r.ok) throw { code: 'rimail/bridge', status: r.status };
  return r.json();
}
/* تصغير صورة إلى data URL (للصورة الشخصية) */
function resizeImage(file, size, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'rimail/image' }); }; img.src = url;
  });
}

/* ═══ البحث المتقدم ═══ */
const KNOWN_OPS = new Set(['from', 'to', 'cc', 'bcc', 'subject', 'label', 'has', 'is', 'in', 'category', 'after', 'before', 'older_than', 'newer_than', 'larger', 'smaller', 'filename']);

      case 'cc': return m.cc.join(' ').toLowerCase().includes(v);
      case 'bcc': return m.bcc.join(' ').toLowerCase().includes(v);
      case 'subject': return m.subject.toLowerCase().includes(v);

}
function getRows() {

  const rows = [];

  if (!ctx.text && !ctx.atts.length && !ctx.subject.trim()) { snack('الرسالة فارغة'); return; }
  const proceed = () => {
    const mail = draftObj(); clearTimeout(ctx.timer); $('#ac')?.remove();
    mail.expires = ctx.confMs ? 1 : 0; mail.replyKey = undefined;
    const replyKey = ctx.replyKey, confMs = ctx.confMs, init = { ...draftInit(mail), replyKey, confMs, subject: mail.subject };
    $('#compose')?.remove(); C = null;
    if (opt.at) {
      Backend.save({ ...mail, folder: 'scheduled', sendAt: opt.at, expires: confMs ? -confMs : 0 }); snack('تمت جدولة الرسالة — ' + fmtFull(opt.at), { label: 'عرض', fn: () => go('scheduled') }, 6000); return;
    }
    Backend.save({ ...mail, expires: confMs ? -confMs : 0 });
    let undone = false; const secs = clamp(+S.settings.undoSecs || 0, 0, 30);
    const fire = () => { if (!undone) finalizeSend({ ...mail, expires: confMs ? -confMs : 0 }, replyKey); };
    if (!secs) { fire(); return; }
    const t = setTimeout(fire, secs * 1000);
    snack('جارٍ الإرسال…', { label: 'تراجع', fn: () => { undone = true; clearTimeout(t); openCompose(init); } }, secs * 1000);
  };
  if (!ctx.subject.trim()) confirmDlg('إرسال بدون موضوع؟', 'لم تكتب موضوعًا لهذه الرسالة. هل تريد إرسالها على أي حال؟', 'إرسال', () => { proceed(); }); else proceed();
}
/* expires سالب = مدة (تُحوَّل إلى وقت مطلق لحظة الإرسال الفعلي) */
async function finalizeSend(mail, replyKey) {
  const t = now(); let expires = 0; if (mail.expires < 0) expires = t - mail.expires; else if (mail.expires > 1) expires = mail.expires;
  mail = { ...mail, ts: t, expires, folder: 'sent', read: true, sendAt: 0 };
  const rec = uniq([...mail.to, ...mail.cc, ...mail.bcc]), internal = rec.filter(isInternal), external = rec.filter(a => !isInternal(a));
  let failed = [], extFailed = [];
  try { failed = internal.length ? await Backend.deliver(internal.map(local), mail) : []; } catch (e) { console.error(e); failed = internal.map(local); if (e && e.code === 'rimail/suspended') { snack(errMsg(e)); } }
  if (external.length) {
    if (USE_BRIDGE) {
      try {
        const pick = l => l.filter(a => !isInternal(a));
        await bridgeSend({ id: mail.id, to: pick(mail.to), cc: pick(mail.cc), bcc: pick(mail.bcc), subject: mail.subject, text: mail.body, html: mail.html, attachments: mail.atts.filter(a => /^https:/.test(a.url)).map(a => ({ filename: a.name, path: a.url })) });
      } catch (e) { console.error(e); extFailed = external; }
    } else extFailed = external;
  }
  try { const l = sendLog(); l.push(t); localStorage.setItem('rimail_sends_' + S.user.uid, JSON.stringify(l)); } catch {}
  await Backend.save({ ...mail, expires: 0, ext: external.length > 0 });
  const allFailed = [...failed.map(u => u + '@' + DOMAIN), ...extFailed];
  if (allFailed.length) {
    await Backend.save({ ...blank(), id: uid(), from: 'mailer-daemon@' + DOMAIN, fromName: 'Mail Delivery Subsystem', to: [S.user.address], ts: now(), auto: true, filtered: true, threadId: mail.threadId,
      subject: 'تعذّر تسليم الرسالة: ' + (mail.subject || '(بدون موضوع)'), body: `لم يتم تسليم رسالتك إلى:\n${allFailed.join('\n')}\n\nالسبب: العنوان غير موجود أو تعذّر الوصول إليه.` });
    snack('تعذّر تسليم الرسالة إلى بعض المستلمين');
  } else snack('تم إرسال الرسالة', { label: 'عرض', fn: () => go('sent', threadKey(mail)) });
  if (replyKey) { const ids = (S.threads.get(replyKey) || []).filter(m => m.folder === 'inbox').map(m => m.id); if (ids.length) { S.settings.sendArchive ? A.archive(ids) : Promise.all(ids.map(i => Backend.patch(i, { read: true }))); } }
}
/* إرسال المجدولة عند حلول وقتها (يعمل أثناء فتح التطبيق) */
async function runScheduled() {
  const due = S.mails.filter(m => m.folder === 'scheduled' && m.sendAt && m.sendAt <= now());
  for (const m of due) { await Backend.patch(m.id, { sendAt: 0, folder: 'draft' }); await finalizeSend({ ...m, folder: 'sent' }, ''); }
}

function replyTo(m, mode, text = '') {
  const me = S.user.address, own = m.from === me, pre = (p, s) => new RegExp('^' + p + ':', 'i').test(s) ? s : p + ': ' + s;
  const key = threadKey(m), tid = m.threadId || m.id, orig = m.html ? sanitizeHTML(m.html, { noLinks: true }) : textToHtml(m.body);
  const head = `${esc(fmtFull(m.ts))}، ${esc(m.fromName || m.from)} &lt;${esc(m.from)}&gt; كتب:`;
  const sig = S.settings.signatureOnReply ? sigHTML() : '';
  const lead = text ? `<div>${textToHtml(text)}</div>` : '<div><br></div>';
  if (mode === 'forward') {
    if (m.noForward) { snack('المرسل منع إعادة توجيه هذه الرسالة'); return; }
    return openCompose({ threadId: undefined, subject: pre('Fwd', m.subject), atts: m.atts,
      html: `${lead}${sig}<div class="qh">---------- رسالة محوّلة ----------<br>من: ${esc(m.fromName)} &lt;${esc(m.from)}&gt;<br>التاريخ: ${esc(fmtFull(m.ts))}<br>الموضوع: ${esc(m.subject)}<br>إلى: ${esc(m.to.join(', '))}</div><blockquote class="q">${orig}</blockquote>` });
  }
  let to = own ? [...m.to] : [m.from], cc = [];
  if (mode === 'all') { to = uniq([own ? '' : m.from, ...m.to]).filter(a => a && a !== me); cc = m.cc.filter(a => a !== me && !to.includes(a)); }
  openCompose({ to, cc, threadId: tid, replyKey: key, subject: pre('Re', m.subject),
    html: `${lead}${sig}${S.settings.quoteOnReply ? `<div class="qh">${head}</div><blockquote class="q">${orig}</blockquote>` : ''}` });
}

function initPages() {

    if (t.dataset.star) { const set = $$('[data-star]', P).filter(c => c.checked).map(c => c.dataset.star); if (!set.length) { t.checked = true; return; } saveSettings({ starSet: set }); return; }
    if (t.id === 'av-file' && t.files[0]) avatarChosen(t.files[0]);
    if (t.id === 'imp-file' && t.files[0]) importFile(t.files[0]);
    if (t.id === 'ct-file' && t.files[0]) importCSV(t.files[0]);

}

function labelEdit(l) {

    actions: [{ text: 'إلغاء' }, { text: 'حفظ', primary: true, fn: async box => {
      const n = box.querySelector('#le-n').value.trim().replace(/[\/\\#]/g, ''), c = box.querySelector('[name=le-c]:checked')?.value || LABEL_COLORS[0];
      if (!n) return false; if (n !== l && S.profile.labels.includes(n)) { snack('اسم التصنيف مستخدم'); return false; }

      saveProfile({ labels, labelMeta: lm, filters }); } }] });

      else if (reset) { const m = v('#a-id'); if (!validEmail(m)) throw { msg: 'أدخل بريدًا صالحًا' }; await Backend.resetPassword(m); err(''); $('#a-err').textContent = 'إن كان البريد مسجّلًا فستصلك رسالة الاستعادة.'; $('#a-err').classList.add('ok'); }
      else if (signup) {
        if (appConfig.signupOpen === false) throw { code: 'rimail/closed' };
        const n = v('#a-name'), u = v('#a-user').toLowerCase(), em = v('#a-email').toLowerCase(), p = $('#a-pass').value;
        if (!n) throw { msg: 'أدخل الاسم' }; if (!validUser(u)) throw { msg: 'اسم المستخدم: 3–30 حرفًا إنجليزيًا صغيرًا أو أرقامًا أو . _' };
        if (em && !validEmail(em)) throw { msg: 'البريد غير صالح' }; if (p.length < 8) throw { msg: 'كلمة المرور 8 أحرف على الأقل' };
        await Backend.signUp({ name: n, username: u, email: em, password: p });
      } else { const id = v('#a-id').toLowerCase(), p = $('#a-pass').value; if (!id || !p) throw { msg: 'أدخل بيانات الدخول' }; await Backend.signIn(id, p); }
    } catch (e) { err(e.msg || errMsg(e)); } finally { go_.disabled = false; }
  });
  (A_.querySelector('input:not([type=hidden])') || {}).focus?.();
}

/* قفل التطبيق */
function showLock() {
  return new Promise(res => {
    const L = document.createElement('div'); L.id = 'lock'; L.className = 'lock';
    L.innerHTML = `<div class="auth-card"><img src="${LOGO}" width="64" height="64" alt=""><h2>التطبيق مقفل</h2><input type="password" inputmode="numeric" id="lk-in" maxlength="8" placeholder="الرمز" autocomplete="off"><div class="a-err" id="lk-err"></div><button type="button" class="btn primary wide" id="lk-go">فتح</button><button type="button" class="link" id="lk-out">تسجيل الخروج</button></div>`;
    document.body.append(L); const lk = S.profile.appLock;
    const go_ = async () => { let ok = false; try { ok = (await kdf($('#lk-in').value, unb64(lk.salt))) === lk.hash; } catch {} if (ok) { S.unlocked = true; L.remove(); res(true); } else { $('#lk-err').textContent = 'رمز غير صحيح'; $('#lk-in').value = ''; } };
    $('#lk-go').onclick = go_; $('#lk-in').addEventListener('keydown', e => e.key === 'Enter' && go_()); $('#lk-out').onclick = () => { L.remove(); Backend.signOut(); res(false); }; $('#lk-in').focus();
  });
}

/* رسائل الترحيب */
async function seedWelcome() {
  const t = now(), base = { ...blank(), to: [S.user.address], category: 'updates', filtered: true };
  const list = [
    { id: 'welcome-' + S.user.uid, from: 'team@' + DOMAIN, fromName: 'Rimail Team', category: 'primary', subject: `أهلًا ${S.user.name} في Rimail 💌`, ts: t - 1000,
      body: `أهلًا ${S.user.name}!\n\nهذا بريدك الجديد ${S.user.address}.\n\n• اكتب رسائل منسّقة وأرفق الصور والملفات.\n• نظّم مواعيدك في التقويم.\n• اضبط الرد التلقائي والتوقيع والفلاتر من الإعدادات.\n• يمكنك تثبيت التطبيق على هاتفك من قائمة صورتك.\n\nنتمنى لك تجربة ممتعة!` },
    { id: 'tips-' + S.user.uid, from: 'tips@' + DOMAIN, fromName: 'نصائح Rimail', subject: 'نصائح سريعة للبدء', ts: t - 2000,
      body: 'اضغط / للبحث، وc لرسالة جديدة، وجرّب عوامل البحث مثل from: و has:attachment.\nاسحب الرسالة يمينًا أو يسارًا للأرشفة والحذف.\nاضغط ? لمعرفة كل الاختصارات.' }
  ];
  if (GIFT_NOTE) list.unshift({ id: 'gift-' + S.user.uid, from: 'dad@' + DOMAIN, fromName: 'بابا 💝', subject: 'هدية خاصة لك', ts: t, body: GIFT_NOTE, category: 'primary' });
  for (const m of list) await Backend.save({ ...base, ...m, html: textToHtml(m.body), read: false });
}
async function onUser(u) {
  unwatchMail && unwatchMail(); unwatchEv && unwatchEv(); unwatchMail = unwatchEv = null; closeCompose(false);
  if (!u) { S.user = null; S.mails = []; S.events = []; S.unlocked = false; loggedLog = false; S.byId = new Map(); S.threads = new Map(); authMode = 'login'; showAuth(true); renderAuth(); return; }
  try { appConfig = await Backend.getConfig(); } catch {}
  if (!u.username) { showAuth(true); renderAuth({ name: u.name }); return; }
  if (u.status === 'banned') { await Backend.signOut(); showAuth(true); renderAuth(); $('#a-err').textContent = 'هذا الحساب محظور.'; return; }
  if (appConfig.maintenance && !u.isAdmin) { await Backend.signOut(); showAuth(true); renderAuth(); $('#a-err').textContent = 'التطبيق تحت الصيانة حاليًا. حاول لاحقًا.'; return; }
  S.user = u; setProfile(u.profile);
  if (S.profile.appLock?.hash && !S.unlocked) { showAuth(true); $('#auth').innerHTML = ''; if (!(await showLock())) return; }
  showAuth(false);
  $('#hdr-avatar').innerHTML = ''; updateHdrAvatar();
  const banner = $('#motd'); banner.hidden = !appConfig.motd; banner.textContent = appConfig.motd || '';
  unwatchMail = Backend.watch(list => { S.mails = list.map(norm); S.byId = new Map(S.mails.map(m => [m.id, m])); buildThreads(); render(); processIncoming(); });
  unwatchEv = Backend.watchEvents(list => { S.events = list.map(cleanEvent).filter(Boolean); if (S.view === 'calendar') renderPageForce(); });
  if (!S.profile.seeded) { Backend.saveProfile({ seeded: true }); S.profile.seeded = true; seedWelcome().catch(console.error); }
  if (!loggedLog) { loggedLog = true; Backend.touch(); const log = [...(S.profile.loginLog || []), { ts: now(), ua: (navigator.userAgent.match(/(Firefox|Edg|Chrome|Safari)\/[\d.]+/) || [''])[0] + (/Mobi/.test(navigator.userAgent) ? ' · جوال' : '') }].slice(-20); S.profile.loginLog = log; Backend.saveProfile({ loginLog: log }); }
  if (!location.hash) location.hash = '#!/inbox'; route();
}
function updateHdrAvatar() { const b = $('#hdr-avatar'); if (b && S.user) b.innerHTML = avatarHTML(S.user.address, S.user.name, 'sender-avatar sm'); }
const _render = renderNow;
renderNow = function () { _render(); updateHdrAvatar(); };

async function boot() {
  applyAppearance();
  try { Backend = USE_FIREBASE ? await makeFirebase() : makeLocal(); }
  catch (e) { console.error(e); $('#boot').innerHTML = '<p>تعذّر تحميل الخدمة. تحقق من الاتصال ثم أعد المحاولة.</p><button class="btn primary" id="boot-retry">إعادة المحاولة</button>'; $('#boot-retry').onclick = () => location.reload(); return; }
  $('#boot').hidden = true; bindEvents(); initPages(); startBackground();
  setInterval(() => { if (S.user && C) C.persist && C.dirty && C.persist(); }, 15000);
  Backend.getConfig().then(c => { appConfig = c; }).catch(() => {});
  Backend.onAuth(onUser);
  if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
